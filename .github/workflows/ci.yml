name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: IP guard — no Homelander in the bundle
        run: bash tests/no_homelander_test.sh

      - name: Mask policy — arbitrary user HTML is never loaded
        run: |
          swiftc MEETAMASK/MaskLibrary.swift tests/main.swift -o "$RUNNER_TEMP/masktest"
          "$RUNNER_TEMP/masktest"

      - name: Seqlock — shared-memory frame hand-off is tear-free
        run: |
          clang++ -std=c++17 -O2 engine/frame_shm.mm engine/test/seqlock_test.mm -o "$RUNNER_TEMP/seqtest"
          # Exit codes: 0 = pass, 1 = real seqlock tear (regression, fail now),
          # 2 = inconclusive (workload didn't race on this runner — retry, don't red the build).
          for i in 1 2 3 4 5; do
            "$RUNNER_TEMP/seqtest"; rc=$?
            if [ "$rc" -eq 0 ]; then echo "seqlock PASS (attempt $i)"; exit 0; fi
            if [ "$rc" -eq 1 ]; then echo "seqlock REGRESSION (torn frame accepted)"; exit 1; fi
            echo "seqlock inconclusive (attempt $i, rc=$rc) — retrying"
          done
          echo "seqlock inconclusive after 5 attempts — not a regression, passing"; exit 0

  build:
    name: Build host app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Compile-only sanity: no signing, no provisioning. Proves the Swift app +
      # camera extension still build; signing/notarization live in dist/ (not CI yet).
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MEETAMASK.xcodeproj \
            -scheme MEETAMASK \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO
