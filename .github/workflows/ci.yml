name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Single source of truth: tests/run-all.sh (also runnable locally via `make test-all`).
      - name: Run fast tests (IP guard, mask policy, seqlock)
        run: bash tests/run-all.sh

  build:
    name: Build host app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Compile-only sanity: no signing, no provisioning. Proves the Swift app +
      # camera extension still build; signing/notarization live in dist/ (not CI yet).
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MEETAMASK.xcodeproj \
            -scheme MEETAMASK \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO
